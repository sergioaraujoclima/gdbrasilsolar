name: Deploy Automático GDBrasilSolar

on:
  push:
    branches:
      - main

env:
  SITE_URL: https://www.gdbrasilsolar.com.br

jobs:
  web-deploy:
    name: FTP Deploy Plataforma Solar
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Baixando o código atualizado
      uses: actions/checkout@v4

    - name: 🔐 Gerando config/config.php a partir dos secrets
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        APP_TOKEN: ${{ secrets.APP_TOKEN }}
        GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
        GROWATT_URL: ${{ secrets.GROWATT_URL }}
      run: |
        php -r '
          $cfg = [
            "db_host"   => getenv("DB_HOST") ?: "localhost",
            "db_name"   => (string) getenv("DB_NAME"),
            "db_user"   => (string) getenv("DB_USER"),
            "db_pass"   => (string) getenv("DB_PASS"),
            "app_token" => (string) getenv("APP_TOKEN"),
            "growatt_token" => (string) getenv("GROWATT_TOKEN"),
            "growatt_url"   => (string) getenv("GROWATT_URL"),
          ];
          file_put_contents("config/config.php", "<?php\nreturn " . var_export($cfg, true) . ";\n");
        '

    - name: 🚀 Enviando arquivos via FTP para a Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./ # A conta FTP já abre dentro de public_html

    - name: 🩺 Testando conexão com o MySQL
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        APP_TOKEN: ${{ secrets.APP_TOKEN }}
      run: |
        faltando=""
        for s in DB_NAME DB_USER DB_PASS APP_TOKEN; do
          [ -z "${!s}" ] && faltando="$faltando $s"
        done
        if [ -n "$faltando" ]; then
          echo "::error::Secrets ausentes:$faltando"
          exit 1
        fi
        http=$(curl -sS -o resposta.json -w '%{http_code}' \
          -H "X-Deploy-Token: $APP_TOKEN" "$SITE_URL/ops/db-test.php")
        corpo=$(head -c 300 resposta.json | tr -d '\n')
        if [ "$http" = "200" ] && grep -q '"ok":true' resposta.json; then
          echo "::notice::Banco OK: $corpo"
        else
          echo "::error::Teste do banco falhou (HTTP $http): $corpo"
          exit 1
        fi

    # Aplica as migrations pendentes de database/migrations. Com [rollback]
    # na mensagem do commit, antes desfaz as migrations cujos arquivos foram
    # removidos do repositório.
    - name: 🗄️ Aplicando migrations do banco
      env:
        APP_TOKEN: ${{ secrets.APP_TOKEN }}
        ROLLBACK: ${{ contains(github.event.head_commit.message, '[rollback]') && '1' || '0' }}
      run: |
        http=$(curl -sS -o migrate.json -w '%{http_code}' \
          -H "X-Deploy-Token: $APP_TOKEN" "$SITE_URL/ops/migrate.php?acao=up&rollback=$ROLLBACK")
        corpo=$(head -c 900 migrate.json | tr -d '\n')
        if [ "$http" = "200" ] && grep -q '"ok":true' migrate.json; then
          echo "::notice::Migrations OK: $corpo"
        else
          echo "::error::Migrations falharam (HTTP $http): $corpo"
          exit 1
        fi

    # Só roda quando a mensagem do commit contém [growatt], para respeitar
    # o limite de chamadas da API.
    - name: ☀️ Testando conexão com a API da Growatt
      if: contains(github.event.head_commit.message, '[growatt]')
      env:
        APP_TOKEN: ${{ secrets.APP_TOKEN }}
        GROWATT_TOKEN: ${{ secrets.GROWATT_TOKEN }}
      run: |
        if [ -z "$GROWATT_TOKEN" ]; then
          echo "::error::Secret ausente: GROWATT_TOKEN"
          exit 1
        fi
        http=$(curl -sS -o growatt.json -w '%{http_code}' \
          -H "X-Deploy-Token: $APP_TOKEN" "$SITE_URL/ops/growatt-test.php")
        corpo=$(head -c 300 growatt.json | tr -d '\n')
        if [ "$http" = "200" ] && grep -q '"ok":true' growatt.json; then
          echo "::notice::Growatt OK: $corpo"
        else
          echo "::error::Teste da Growatt falhou (HTTP $http): $corpo"
          exit 1
        fi

    # Carga histórica da geração diária: só roda com [carga] na mensagem do
    # commit. É retomável; se não terminar, basta disparar de novo.
    - name: 📥 Carga histórica da Growatt
      if: contains(github.event.head_commit.message, '[carga]')
      timeout-minutes: 50
      env:
        APP_TOKEN: ${{ secrets.APP_TOKEN }}
      run: |
        chamar() {
          curl -sS -m 120 -o "$2" -w '%{http_code}' \
            -H "X-Deploy-Token: $APP_TOKEN" "$SITE_URL/ops/growatt-sync.php?acao=$1"
        }
        http=$(chamar usinas usinas.json)
        echo "::notice::Usinas (HTTP $http): $(head -c 600 usinas.json | tr -d '\n')"
        grep -q '"ok":true' usinas.json || exit 1

        erros=0
        for i in $(seq 1 150); do
          http=$(chamar historico hist.json || true)
          if [ "$(jq -r '.concluido // false' hist.json 2>/dev/null)" = "true" ]; then
            break
          fi
          erro=$(jq -r '.erro // empty' hist.json 2>/dev/null || echo "HTTP $http")
          if [ "$http" != "200" ] || [ -n "$erro" ]; then
            erros=$((erros + 1))
            echo "Tentativa $i: $erro (HTTP $http)"
            if [ "$erros" -ge 6 ]; then
              echo "::warning::Carga interrompida após $erros recusas seguidas: $erro"
              break
            fi
            sleep 300
          else
            erros=0
            sleep 2
          fi
        done
        echo "::notice::Carga: $(jq -c '{concluido, usinas_detalhe}' hist.json | head -c 900)"
